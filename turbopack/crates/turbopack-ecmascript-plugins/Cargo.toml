[package]
name = "turbopack-ecmascript-plugins"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[features]
transform_emotion = []
default = ["tokio_runtime"]
tokio_runtime = ["turbo-tasks/tokio_runtime", "turbo-tasks-fs/tokio_runtime", "turbopack-core/tokio_runtime", "turbopack-ecmascript/tokio_runtime"]
sync = ["turbo-tasks/sync", "turbo-tasks-fs/sync", "turbopack-core/sync", "turbopack-ecmascript/sync"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
either = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }

turbo-rcstr = { workspace = true }
turbo-tasks = { path = "../turbo-tasks", default-features = false }
turbo-tasks-fs = { path = "../turbo-tasks-fs", default-features = false }
turbopack-core = { path = "../turbopack-core", default-features = false }
turbopack-ecmascript = { path = "../turbopack-ecmascript", default-features = false }

styled_components = { workspace = true }
styled_jsx = { workspace = true }
swc_core = { workspace = true, features = [
  "ecma_ast",
  "ecma_visit",
  "common",
] }
# The plugin-host pieces are pulled in directly instead of via swc_core's
# `__plugin_transform_host` umbrella feature: that feature force-enables
# `swc/plugin`, which drags an (unused here) tokio runtime into the graph —
# the `sync` build must stay tokio-free. These are the exact same crate
# versions swc_core v69 re-exports, so all types stay identical.
swc_plugin_backend_wasmtime = { workspace = true }
swc_plugin_proxy = { workspace = true, features = ["plugin-rt"] }
swc_plugin_runner = { workspace = true, features = [
  "ecma",
  "encoding-impl",
  "plugin_transform_schema_v1",
] }
swc_emotion = { workspace = true }
swc_relay = { workspace = true }

