[package]
name = "turbo-tasks-testing"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false
autotests = false

[lib]
bench = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true }
turbo-tasks = { workspace = true, features = ["non_operation_vc_strongly_consistent"] }
# The `test_instance` factory goes through `make_handle`, so binaries
# that depend on this crate transitively pull in the
# `turbo-tasks-backend` rlib for the `__tt_static_*` providers.
turbo-tasks-backend = { workspace = true }
