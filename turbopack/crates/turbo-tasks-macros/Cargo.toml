[package]
name = "turbo-tasks-macros"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"

[lib]
proc-macro = true
bench = false

[features]
# Dual-mode migration (see DESIGN): when enabled, `#[turbo_tasks::function]` emits a
# synchronous task body instead of an async one. Off by default (= async mode).
# Wired through from the `turbo-tasks` crate's `sync` feature so the whole workspace
# flips together. Drives both this proc-macro's expansion (`cfg!(feature = "sync")`)
# and the `read!`/`parallel!` macro_rules in `turbo-tasks`.
sync = []

[lints]
workspace = true

[dependencies]
either = { workspace = true }
indexmap = { workspace = true }
proc-macro-error = "1.0.4"
proc-macro2 = { workspace = true }
quote = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "visit", "visit-mut"] }

[dev-dependencies]
rstest = { workspace = true }
