[package]
name = "turbopack-cli"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[[bin]]
name = "turbopack-cli"
path = "src/main.rs"
bench = false

[lib]
bench = false

[[bench]]
name = "mod"
harness = false

[[bench]]
name = "small_apps"
harness = false

[features]
default = ["custom_allocator", "tokio_runtime"]
serializable = []
tokio_console = [
  "dep:console-subscriber",
  "tokio/tracing",
  "turbo-tasks/tokio_tracing",
]
profile = []
custom_allocator = ["turbo-tasks-malloc/custom_allocator"]
tokio_runtime = ["dep:tokio", "dep:turbopack-trace-utils", "turbo-tasks/tokio_runtime", "turbo-tasks-backend/tokio_runtime", "turbo-tasks-env/tokio_runtime", "turbo-tasks-fs/tokio_runtime", "turbopack/tokio_runtime", "turbopack-bench/tokio_runtime", "turbopack-browser/tokio_runtime", "turbopack-cli-utils/tokio_runtime", "turbopack-core/tokio_runtime", "turbopack-css/tokio_runtime", "turbopack-dev-server/tokio_runtime", "turbopack-ecmascript/tokio_runtime", "turbopack-ecmascript-plugins/tokio_runtime", "turbopack-ecmascript-runtime/tokio_runtime", "turbopack-env/tokio_runtime", "turbopack-node/tokio_runtime", "turbopack-node/process_pool", "turbopack-nodejs/tokio_runtime", "turbopack-resolve/tokio_runtime"]
sync = ["turbo-tasks/sync", "turbo-tasks-backend/sync", "turbo-tasks-env/sync", "turbo-tasks-fs/sync", "turbopack/sync", "turbopack-bench/sync", "turbopack-browser/sync", "turbopack-cli-utils/sync", "turbopack-core/sync", "turbopack-css/sync", "turbopack-dev-server/sync", "turbopack-ecmascript/sync", "turbopack-ecmascript-plugins/sync", "turbopack-ecmascript-runtime/sync", "turbopack-env/sync", "turbopack-node/sync", "turbopack-nodejs/sync", "turbopack-resolve/sync"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
console-subscriber = { workspace = true, optional = true }
dunce = { workspace = true }
futures = { workspace = true }
owo-colors = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
swc_core = { workspace = true }
# Optional so the no-tokio sync build of `turbopack build` links zero tokio.
tokio = { workspace = true, features = ["full"], optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
turbo-rcstr = { workspace = true }
turbo-tasks = { path = "../turbo-tasks", default-features = false }
turbo-tasks-backend = { path = "../turbo-tasks-backend", default-features = false }
turbo-tasks-env = { path = "../turbo-tasks-env", default-features = false }
turbo-unix-path = { workspace = true }
turbo-tasks-fs = { path = "../turbo-tasks-fs", default-features = false }
turbo-tasks-malloc = { workspace = true, default-features = false }
turbopack = { path = "../turbopack", default-features = false }
turbopack-browser = { path = "../turbopack-browser", default-features = false }
turbopack-cli-utils = { path = "../turbopack-cli-utils", default-features = false }
turbopack-core = { path = "../turbopack-core", default-features = false }
turbopack-css = { path = "../turbopack-css", default-features = false }
turbopack-dev-server = { path = "../turbopack-dev-server", default-features = false }
turbopack-ecmascript = { path = "../turbopack-ecmascript", default-features = false }
turbopack-ecmascript-plugins = { path = "../turbopack-ecmascript-plugins", default-features = false, features = [
  "transform_emotion",
] }
turbopack-ecmascript-runtime = { path = "../turbopack-ecmascript-runtime", default-features = false }
turbopack-env = { path = "../turbopack-env", default-features = false }
turbopack-node = { path = "../turbopack-node", default-features = false }
turbopack-nodejs = { path = "../turbopack-nodejs", default-features = false }
turbopack-resolve = { path = "../turbopack-resolve", default-features = false }
# Trace-to-file + exit handling is tokio-bound and only used by the async `main`
# / dev server; optional + tokio_runtime-gated so the sync build stays tokio-free.
turbopack-trace-utils = { workspace = true, optional = true }
webbrowser = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
vergen-gitcl = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
regex = { workspace = true }
turbopack-bench = { path = "../turbopack-bench", default-features = false }
turbo-tasks-malloc = { workspace = true, features = ["custom_allocator"] }
