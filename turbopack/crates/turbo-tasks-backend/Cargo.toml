[package]
name = "turbo-tasks-backend"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[lints]
workspace = true

[features]
default = ["tokio_runtime"]
# The async execution runtime (tokio + background snapshot/GC jobs). On by default;
# disable for a tokio-free sync build. Forwards to turbo-tasks' equivalent feature.
tokio_runtime = ["dep:tokio", "turbo-tasks/tokio_runtime", "turbo-tasks-testing/tokio_runtime"]
# Synchronous (inline-compute) engine; pair with --no-default-features for a
# tokio-free build: `--no-default-features --features sync`. Forwards to the
# (dev-dependency) test harness so the integration tests build no-tokio too.
sync = ["turbo-tasks/sync", "turbo-tasks-testing/sync"]
print_cache_item_size_with_compressed = ["print_cache_item_size", "dep:lzzzz"]
print_cache_item_size = []
no_fast_stale = []
aggregation_update_no_batch = []
# Force the consistent pair-locked aggregation classifier in either executor mode.
# Sync enables this behavior automatically; this feature lets async tests exercise the same path.
force_pair_locked_aggregation = []
verify_serialization = []
verify_aggregation_graph = []
verify_immutable = []
verify_determinism = ["turbo-tasks/verify_determinism"]
task_dirty_cause = ["turbo-tasks/task_dirty_cause"]
trace_aggregation_update_stats = []
trace_aggregation_update_queue = []
trace_aggregation_update = ["trace_aggregation_update_queue"]
trace_leaf_distance_update = []
trace_find_and_schedule = ["trace_aggregation_update_queue"]
trace_task_completion = []
trace_task_modification = []
trace_task_dirty = ["trace_aggregation_update_queue", "task_dirty_cause"]
trace_task_output_dependencies = []
trace_task_details = []
trace_prepare_tasks = []

[dependencies]
anyhow = { workspace = true }
bincode = { workspace = true }
auto-hash-map = { workspace = true }
bitfield = { workspace = true }
crossbeam-utils = { workspace = true }
dashmap = { workspace = true, features = ["raw-api"]}
hashbrown = { workspace = true, features = ["raw"] }
indexmap = { workspace = true }
lzzzz = { workspace = true, optional = true }
parking_lot = { workspace = true }
rand = { workspace = true }
ringmap = { workspace = true, features = ["serde"] }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
turbo-bincode = { workspace = true }
turbo-persistence = { workspace = true }
turbo-rcstr = { workspace = true }
# Direct path dep (not workspace-inherited) so we can set `default-features = false`
# — cargo forbids overriding default-features on inherited deps. The `tokio_runtime`
# feature re-enables turbo-tasks' async runtime; a no-tokio backend leaves it off.
turbo-tasks = { path = "../turbo-tasks", default-features = false }
turbo-tasks-hash = { workspace = true }
turbo-tasks-malloc = { workspace = true, default-features = false }
thread_local = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
futures = { workspace = true }
indoc = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
triomphe = { workspace = true }
thiserror = { workspace = true }
turbo-tasks-malloc = { workspace = true , features = ["custom_allocator"]}
rstest = { workspace = true }
# Direct path dep with default-features = false so `--no-default-features --features
# sync` builds the integration tests no-tokio. The backend `sync`/`tokio_runtime`
# features forward to this dev-dep's equivalents.
turbo-tasks-testing = { path = "../turbo-tasks-testing", default-features = false }


[[bench]]
name = "mod"
harness = false
