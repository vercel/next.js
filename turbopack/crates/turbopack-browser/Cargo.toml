[package]
name = "turbopack-browser"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[features]
# enable "HMR" for embedded assets
dynamic_embed_contents = ["turbo-tasks-fs/dynamic_embed_contents"]
# enable test utilities such as `RuntimeType::Dummy`
test = ["turbopack-ecmascript-runtime/test"]
default = ["tokio_runtime"]
tokio_runtime = ["turbo-tasks/tokio_runtime", "turbo-tasks-fs/tokio_runtime", "turbopack/tokio_runtime", "turbopack-core/tokio_runtime", "turbopack-ecmascript/tokio_runtime", "turbopack-ecmascript-runtime/tokio_runtime", "turbopack-resolve/tokio_runtime"]
sync = ["turbo-tasks/sync", "turbo-tasks-fs/sync", "turbopack/sync", "turbopack-core/sync", "turbopack-ecmascript/sync", "turbopack-ecmascript-runtime/sync", "turbopack-resolve/sync"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
either = { workspace = true }
indoc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_qs = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

turbo-bincode = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks = { path = "../turbo-tasks", default-features = false }
turbo-tasks-fs = { path = "../turbo-tasks-fs", default-features = false }
turbo-tasks-hash = { workspace = true }
turbopack = { path = "../turbopack", default-features = false }
turbopack-core = { path = "../turbopack-core", default-features = false }
turbopack-ecmascript = { path = "../turbopack-ecmascript", default-features = false }
turbopack-ecmascript-runtime = { path = "../turbopack-ecmascript-runtime", default-features = false }
turbopack-resolve = { path = "../turbopack-resolve", default-features = false }

