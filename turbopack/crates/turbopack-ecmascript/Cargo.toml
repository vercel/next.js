[package]
name = "turbopack-ecmascript"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[[bench]]
name = "analyzer"
harness = false

[[bench]]
name = "references"
harness = false

[lints]
workspace = true

[dependencies]
allocator-api2 = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
auto-hash-map = { workspace = true }
bincode = { workspace = true }
bumpalo = { workspace = true }
bytes-str = { workspace = true }
data-encoding = { workspace = true }
either = { workspace = true }
indexmap = { workspace = true }
indoc = { workspace = true }
itertools = { workspace = true }
num-bigint = "0.4"
num-traits = "0.2.15"
parking_lot = { workspace = true }
phf = { version = "0.11", features = ["macros"] }
petgraph = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
swc_ecma_react_compiler = { workspace = true }
react_compiler = { workspace = true }
next-custom-transforms = { workspace = true, default-features = false }
swc_sourcemap = { workspace = true }
smallvec = { workspace = true }
strsim = { workspace = true }
thread_local = { workspace = true }
# Optional so a `--no-default-features --features sync` build links zero tokio.
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
turbo-bincode = { workspace = true }
turbo-esregex = { path = "../turbo-esregex", default-features = false }
turbo-frozenmap = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks = { path = "../turbo-tasks", default-features = false }
turbo-tasks-fs = { path = "../turbo-tasks-fs", default-features = false }
turbo-tasks-hash = { workspace = true }
turbopack-core = { path = "../turbopack-core", default-features = false }
turbopack-resolve = { path = "../turbopack-resolve", default-features = false }
turbopack-swc-utils = { path = "../turbopack-swc-utils", default-features = false }
url = { workspace = true }
urlencoding = { workspace = true }

swc_core = { workspace = true, features = [
  "ecma_ast",
  "ecma_ast_serde",
  "common",
  "common_concurrent",
  "common_sourcemap",
  "ecma_ast_shrink",
  "ecma_codegen",
  "ecma_helpers_inline",
  "ecma_lints",
  "ecma_minifier",
  "ecma_parser",
  "ecma_preset_env",
  "ecma_transforms",
  "ecma_transforms_react",
  "ecma_transforms_optimization",
  "ecma_transforms_typescript",
  "ecma_transforms_proposal",
  "ecma_quote",
  "ecma_visit",
  "ecma_visit_path",
  "ecma_visit_serde",
  "ecma_utils",
  "testing",
  "base",
] }

[features]
default = ["tokio_runtime"]
tokio_runtime = ["dep:tokio", "turbo-esregex/tokio_runtime", "turbo-tasks/tokio_runtime", "turbo-tasks-backend/tokio_runtime", "turbo-tasks-fs/tokio_runtime", "turbo-tasks-testing/tokio_runtime", "turbopack-core/tokio_runtime", "turbopack-resolve/tokio_runtime", "turbopack-swc-utils/tokio_runtime", "turbopack-test-utils/tokio_runtime"]
sync = ["turbo-esregex/sync", "turbo-tasks/sync", "turbo-tasks-backend/sync", "turbo-tasks-fs/sync", "turbo-tasks-testing/sync", "turbopack-core/sync", "turbopack-resolve/sync", "turbopack-swc-utils/sync", "turbopack-test-utils/sync"]

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
rstest = { workspace = true }
turbo-tasks-backend = { path = "../turbo-tasks-backend", default-features = false }
turbo-tasks-malloc = { workspace = true, features  = ["custom_allocator"] }
turbo-tasks-testing = { path = "../turbo-tasks-testing", default-features = false }
turbopack-test-utils = { path = "../turbopack-test-utils", default-features = false }
