[package]
name = "turbopack-image"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[features]

# [NOTE]: Before enable this, ensure this can build all of the target platforms we support.
avif = ["image/avif"]
webp = ["image/webp"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.21.0"
bincode = { workspace = true }
image = { workspace = true, default-features = false, features = [
  "gif",
  "png",
  "jpeg",
  "ico",
  "bmp",
  "tga",
] }
mime = { workspace = true }
phf = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
turbo-bincode = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks = { workspace = true }
turbo-tasks-fs = { workspace = true }
turbopack-core = { workspace = true }

# Dev-only link of `turbo-tasks-backend` so the `__tt_static_*` extern
# symbols resolve in this crate's test binary. See the matching `extern
# crate` in `src/lib.rs`.
[dev-dependencies]
turbo-tasks-backend = { workspace = true }

