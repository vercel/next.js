[package]
name = "turbo-tasks-malloc"
version = "0.1.0"
description = "A wrapper around mimalloc or the system allocator that tracks allocations"
license = "MIT"
edition = "2024"
autobenches = false

[lib]
bench = false

[[bench]]
name = "allocation"
harness = false

[lints]
workspace = true

[dependencies]

[dev-dependencies]
criterion = { workspace = true }

# mimalloc's official Rust bindings live in `contrib/rust` of microsoft/mimalloc and are not
# published to crates.io (the crate names are taken), so depend on a release tag via git. Bumping
# the tag also bumps the bundled C library.
[target.'cfg(not(any(target_os = "linux", target_family = "wasm", miri)))'.dependencies]
mimalloc = { git = "https://github.com/microsoft/mimalloc", tag = "v3.6.1", optional = true }

[target.'cfg(all(target_os = "linux", not(target_family = "wasm"), not(miri)))'.dependencies]
mimalloc = { git = "https://github.com/microsoft/mimalloc", tag = "v3.6.1", features = [
  "local_dynamic_tls",
], optional = true }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[features]
custom_allocator = ["dep:mimalloc"]
default = ["custom_allocator"]
