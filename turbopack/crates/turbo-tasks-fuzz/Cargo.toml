[package]
name = "turbo-tasks-fuzz"
version = "0.0.0"
description = "A collection of fuzzers for `turbo-tasks`"
license = "MIT"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
rustc-hash = { workspace = true }
tokio = { workspace = true }
turbo-rcstr = { workspace = true }
turbo-tasks = { path = "../turbo-tasks", default-features = false }
turbo-tasks-backend = { path = "../turbo-tasks-backend", default-features = false }
turbo-tasks-fs = { path = "../turbo-tasks-fs", default-features = false }

[features]
default = ["tokio_runtime"]
tokio_runtime = ["turbo-tasks/tokio_runtime", "turbo-tasks-backend/tokio_runtime", "turbo-tasks-fs/tokio_runtime"]
sync = ["turbo-tasks/sync", "turbo-tasks-backend/sync", "turbo-tasks-fs/sync"]

