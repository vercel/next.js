[package]
name = "turbo-rcstr"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
atom_size_64 = ["turbo-rcstr-macros/atom_size_64"]
atom_size_128 = ["turbo-rcstr-macros/atom_size_128"]
napi = ["dep:napi"]

[dependencies]
bincode = { workspace = true }
triomphe = { workspace = true }
turbo-tasks-hash = { workspace = true }
serde = { workspace = true }
new_debug_unreachable = "1.0.6"
shrink-to-fit = { workspace = true }
rustc-hash = { workspace = true }
bytes-str = { workspace = true }
smallvec = { workspace = true }
turbo-bincode = { workspace = true }
turbo-rcstr-macros = { path = "../turbo-rcstr-macros" }
unty = { workspace = true }

napi = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
scattered-collect = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Only used by the benchmarks, which don't run on wasm. Gated by target so that
# `cargo test -p turbo-rcstr --lib --target wasm32-wasip1-threads` can build: criterion pulls in
# rayon, which refuses to compile for wasi, and cargo resolves dev-dependencies even for `--lib`.
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "mod"
harness = false
