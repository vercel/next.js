name: Next Maintainer Auto Close

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: next-maintainer-auto-close
  cancel-in-progress: false

jobs:
  close-one-verified-issue:
    if: github.repository == 'vercel/next.js' && github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      issues: write
    steps:
      - name: Pull and deliver one verified close
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const queue = "https://next-maintainer-agent.vercel.tools/eve/agents/close-verifier/eve/v1/auto-close";
            const repository = "vercel/next.js";
            const [owner, repo] = repository.split("/");
            const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;

            class StaleApproval extends Error {}

            async function queueRequest(path, body) {
              const token = await core.getIDToken("next-maintainer-auto-close");
              core.setSecret(token);
              const response = await fetch(`${queue}${path}`, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${token}`,
                  "x-vercel-trusted-oidc-idp-token": token,
                  ...(body === undefined ? {} : { "content-type": "application/json" }),
                },
                ...(body === undefined ? {} : { body: JSON.stringify(body) }),
                redirect: "error",
                signal: AbortSignal.timeout(15_000),
              });
              if (response.status === 204) return null;
              const text = await response.text();
              if (!response.ok) throw new Error(`Queue returned ${response.status}: ${text.slice(0, 300)}`);
              return text.length === 0 ? null : JSON.parse(text);
            }

            function validateClaim(value) {
              if (value === null) return null;
              if (typeof value !== "object") throw new StaleApproval("Invalid queue claim.");
              if (value.repository !== repository) throw new StaleApproval("Unexpected repository.");
              if (!uuid.test(value.approvalId) || !uuid.test(value.leaseToken)) throw new StaleApproval("Invalid queue identity.");
              if (!Number.isInteger(value.issueNumber) || value.issueNumber <= 0) throw new StaleApproval("Invalid issue number.");
              if (!Number.isInteger(value.sourceConfidence) || value.sourceConfidence < 80 || value.sourceConfidence > 100) {
                throw new StaleApproval("Invalid source confidence.");
              }
              if (typeof value.closeComment !== "string" || value.closeComment.length === 0) {
                throw new StaleApproval("Invalid close comment.");
              }
              if (!["completed", "not_planned", "duplicate"].includes(value.stateReason)) {
                throw new StaleApproval("Invalid state reason.");
              }
              if (value.stateReason === "duplicate") {
                if (!Number.isInteger(value.duplicateIssueNumber) || value.duplicateIssueNumber <= 0 || value.duplicateIssueNumber === value.issueNumber) {
                  throw new StaleApproval("Invalid duplicate issue.");
                }
              } else if (value.duplicateIssueNumber !== null) {
                throw new StaleApproval("Unexpected duplicate issue.");
              }
              const marker = `<!-- next-maintainer-auto-close:${value.approvalId} -->`;
              if (value.marker !== marker || `${value.closeComment}\n\n${marker}`.length > 65_536) {
                throw new StaleApproval("Invalid marker or comment length.");
              }
              return value;
            }

            async function report(claim, outcome, error) {
              await queueRequest(`/${claim.approvalId}/delivery`, {
                leaseToken: claim.leaseToken,
                outcome,
                ...(error === undefined ? {} : { error: error.slice(0, 2_000) }),
              });
            }

            async function readIssue(number) {
              try {
                const issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
                if (issue.number !== number || issue.repository_url !== `https://api.github.com/repos/${repository}`) {
                  throw new StaleApproval("Issue was transferred to another repository.");
                }
                return issue;
              } catch (error) {
                if (error?.status === 404 || error?.status === 410) throw new StaleApproval("Issue no longer exists.");
                throw error;
              }
            }

            async function wasReopenedAfter(comment, issueNumber) {
              if (!Number.isInteger(comment.id)) throw new Error("Marker comment has no ID.");
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const markerIndex = timeline.findIndex(
                (event) => event.event === "commented" && event.id === comment.id,
              );
              if (markerIndex === -1) throw new Error("Marker comment is missing from the timeline.");
              return timeline.slice(markerIndex + 1).some((event) => event.event === "reopened");
            }

            const claimed = await queueRequest("/claim");
            if (claimed === null) return;
            let claim = claimed;

            try {
              claim = validateClaim(claim);
              const issue = await readIssue(claim.issueNumber);
              if (issue.pull_request !== undefined) throw new StaleApproval("Target is a pull request.");

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: claim.issueNumber,
                per_page: 100,
              });
              const markerComment = comments.find((comment) => (comment.body ?? "").includes(claim.marker));

              if (issue.state === "closed") {
                if (markerComment === undefined) throw new StaleApproval("Issue was closed independently.");
                if (issue.state_reason !== claim.stateReason) {
                  throw new StaleApproval("Issue closed with a different reason.");
                }
                await report(claim, "closed");
                return;
              }
              if (issue.state !== "open") throw new StaleApproval("Issue is not open.");
              if (
                markerComment !== undefined &&
                await wasReopenedAfter(markerComment, claim.issueNumber)
              ) {
                throw new StaleApproval("Issue was reopened after delivery.");
              }

              let duplicateIssueId;
              if (claim.stateReason === "duplicate") {
                const canonical = await readIssue(claim.duplicateIssueNumber);
                if (canonical.pull_request !== undefined) throw new StaleApproval("Duplicate target is not an issue.");
                duplicateIssueId = canonical.id;
              }

              if (markerComment === undefined) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: claim.issueNumber,
                  body: `${claim.closeComment}\n\n${claim.marker}`,
                });
              }

              const updated = (await github.rest.issues.update({
                owner,
                repo,
                issue_number: claim.issueNumber,
                state: "closed",
                state_reason: claim.stateReason,
                ...(duplicateIssueId === undefined ? {} : { duplicate_issue_id: duplicateIssueId }),
              })).data;
              if (updated.state !== "closed" || updated.state_reason !== claim.stateReason) {
                throw new StaleApproval("GitHub did not apply the requested close reason.");
              }
              await report(claim, "closed");
            } catch (error) {
              const outcome = error instanceof StaleApproval ? "stale" : "retry";
              const message = error instanceof Error ? error.message : String(error);
              if (
                typeof claim === "object" && claim !== null &&
                uuid.test(claim.approvalId) && uuid.test(claim.leaseToken)
              ) {
                try {
                  await report(claim, outcome, message);
                } catch (callbackError) {
                  core.warning(`Could not report ${outcome}: ${callbackError}`);
                }
              }
              if (outcome === "retry") throw error;
              core.warning(message);
            }
