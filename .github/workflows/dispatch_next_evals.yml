name: Dispatch Next.js Release Evals

on:
  workflow_run:
    workflows:
      - build-and-deploy
    types:
      - completed

concurrency:
  group: dispatch-next-evals-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.repository_owner == 'vercel' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Identify the stable release
        id: release
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run
            const releaseRef = workflowRun.head_commit?.message?.trim() || ''
            const match = /^v(\d+\.\d+\.\d+)$/.exec(releaseRef)

            if (!match || workflowRun.head_branch !== releaseRef) {
              core.info('The completed run did not publish a stable release tag')
              core.setOutput('should_dispatch', 'false')
              return
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowRun.workflow_id,
              event: 'push',
              head_sha: workflowRun.head_sha,
              per_page: 100,
            })

            const releaseBranches = [
              ...new Set(
                data.workflow_runs
                  .map((run) => run.head_branch)
                  .filter(
                    (branch) =>
                      branch === 'canary' ||
                      branch === 'releases/lts/active' ||
                      branch === 'releases/lts/maintenance' ||
                      /^next-\d+-\d+$/.test(branch)
                  )
              ),
            ]

            if (releaseBranches.length !== 1) {
              core.setFailed(
                `Expected one release branch run for ${workflowRun.head_sha}, found: ${releaseBranches.join(', ') || 'none'}`
              )
              return
            }

            const sourceBranch = releaseBranches[0]
            const releaseKind = sourceBranch === 'canary' ? 'release' : 'backport'

            core.setOutput('should_dispatch', 'true')
            core.setOutput('event_type', `next-${releaseKind}-release`)
            core.setOutput('version', match[1])
            core.setOutput('ref', releaseRef)
            core.setOutput('sha', workflowRun.head_sha)
            core.setOutput('release_kind', releaseKind)
            core.setOutput('source_branch', sourceBranch)
            core.setOutput('source_run_url', workflowRun.html_url)

      - name: Create GitHub App token
        id: release-app-token
        if: steps.release.outputs.should_dispatch == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: next-evals-oss
          permission-contents: write

      - name: Dispatch release evals
        if: steps.release.outputs.should_dispatch == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'next-evals-oss',
              event_type: process.env.EVENT_TYPE,
              client_payload: {
                nextVersion: process.env.NEXT_VERSION,
                nextRef: process.env.NEXT_REF,
                nextSha: process.env.NEXT_SHA,
                releaseKind: process.env.RELEASE_KIND,
                sourceBranch: process.env.SOURCE_BRANCH,
                sourceRunUrl: process.env.SOURCE_RUN_URL,
              },
            })

            core.info(
              `Dispatched ${process.env.RELEASE_KIND} evals for Next.js ${process.env.NEXT_VERSION}`
            )
        env:
          EVENT_TYPE: ${{ steps.release.outputs.event_type }}
          NEXT_VERSION: ${{ steps.release.outputs.version }}
          NEXT_REF: ${{ steps.release.outputs.ref }}
          NEXT_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_KIND: ${{ steps.release.outputs.release_kind }}
          SOURCE_BRANCH: ${{ steps.release.outputs.source_branch }}
          SOURCE_RUN_URL: ${{ steps.release.outputs.source_run_url }}
