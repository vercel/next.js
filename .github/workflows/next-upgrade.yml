name: Scheduled Next.js upgrade

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of approved app paths and policies
        required: true
        type: string
      supporting-paths:
        description: JSON array of approved supporting workspace paths
        default: '[]'
        type: string
      agent-auth:
        description: Vercel AI Gateway mode for the hosted agent
        required: true
        type: string
      telemetry-disabled:
        description: Disable Next.js telemetry for this workflow and its child processes
        default: false
        type: boolean
      # Test-only inputs for the external end-to-end repository. Setup never writes them.
      model:
        default: ''
        type: string
      preview-package:
        default: false
        type: boolean
    secrets:
      agent-credential:
        required: true
      publish-token:
        required: true

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: ${{ inputs.telemetry-disabled && '1' || '' }}

concurrency:
  group: next-upgrade-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # A missing token stops the run before the agent spends any time.
  preflight:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the publication token
        env:
          PUBLISH_TOKEN_PROVIDED: ${{ secrets.publish-token != '' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_TOKEN_PROVIDED" != true ]; then
            echo 'Register a fine-grained personal access token with contents, pull-requests, and workflows write access as the NEXT_UPGRADE_PUBLISH_TOKEN secret.' >&2
            exit 1
          fi

  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    # Preparation stops starting agents before this limit so it can still
    # upload what it verified (see the budget in prepare-upgrade.mjs).
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      default-branch: ${{ steps.branch.outputs.name }}
    steps:
      # Scheduled events carry no repository payload, so ask the API.
      - name: Look up the default branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          test -n "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Check out the consumer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: consumer
          ref: ${{ steps.branch.outputs.name }}
          persist-credentials: false
      - name: Record consumer base
        id: base
        working-directory: consumer
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned workflow scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: next-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/next-upgrade/
            packages/next/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the pinned Next.js package
        working-directory: next-source/.github/actions/next-upgrade
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREVIEW_PACKAGE: ${{ inputs.preview-package }}
          GH_TOKEN: ${{ inputs.preview-package && github.token || '' }}
        run: node install-next.mjs
      - name: Enable the consumer's package manager
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts corepack@0.34.7
          corepack enable
      - name: Install the selected agent
        env:
          NEXT_UPGRADE_AUTH_MODE: ${{ inputs.agent-auth }}
        run: |
          set -euo pipefail
          case "$NEXT_UPGRADE_AUTH_MODE" in
            codex-ai-gateway-api-key)
              npm install --global --ignore-scripts @openai/codex@0.161.0
              ;;
            claude-ai-gateway-api-key)
              npm install --global --ignore-scripts @anthropic-ai/claude-code@2.1.293
              ;;
            *)
              echo 'Use codex-ai-gateway-api-key or claude-ai-gateway-api-key for agent-auth.' >&2
              exit 1
              ;;
          esac
      - name: Create the agent user
        # The agent and the scripts it starts run as this user, which cannot
        # read the runner's processes or use sudo.
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin next-upgrade-agent
      - name: Prepare verified upgrade candidates
        env:
          NEXT_UPGRADE_ROOT: ${{ github.workspace }}/consumer
          NEXT_UPGRADE_ARTIFACT_DIR: ${{ runner.temp }}/next-upgrade-candidates
          NEXT_UPGRADE_CLI_PATH: ${{ github.workspace }}/next-source/.github/actions/next-upgrade/node_modules/next/dist/bin/next
          NEXT_UPGRADE_TARGETS: ${{ inputs.targets }}
          NEXT_UPGRADE_SUPPORTING_PATHS: ${{ inputs.supporting-paths }}
          NEXT_UPGRADE_AUTH_MODE: ${{ inputs.agent-auth }}
          NEXT_UPGRADE_MODEL: ${{ inputs.model }}
          NEXT_UPGRADE_AGENT_CREDENTIAL: ${{ secrets.agent-credential }}
          NEXT_UPGRADE_AGENT_USER: next-upgrade-agent
        run: node next-source/.github/actions/next-upgrade/prepare-upgrade.mjs
      - name: Upload verified candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-upgrade-candidates
          path: ${{ runner.temp }}/next-upgrade-candidates/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The publication token opens the draft, so the job token only reads.
    permissions:
      contents: read
    steps:
      - name: Check out the assessed consumer base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: consumer
          ref: ${{ needs.prepare.outputs.base-sha }}
          persist-credentials: false
      - name: Check out the pinned workflow scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: next-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/next-upgrade/
            packages/next/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      # The job with write access runs only the locked script dependencies.
      - name: Install the publisher dependencies
        working-directory: next-source/.github/actions/next-upgrade
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          NEXT_UPGRADE_DEPS_ONLY: 'true'
        run: node install-next.mjs
      - name: Download candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-upgrade-candidates
          path: ${{ runner.temp }}/next-upgrade-candidates
      - name: Validate and publish upgrade drafts
        env:
          NEXT_UPGRADE_ROOT: ${{ github.workspace }}/consumer
          NEXT_UPGRADE_ARTIFACT_DIR: ${{ runner.temp }}/next-upgrade-candidates
          NEXT_UPGRADE_BASE_BRANCH: ${{ needs.prepare.outputs.default-branch }}
          NEXT_UPGRADE_TARGETS: ${{ inputs.targets }}
          NEXT_UPGRADE_SUPPORTING_PATHS: ${{ inputs.supporting-paths }}
          NEXT_UPGRADE_PUBLISH_RESULT: ${{ runner.temp }}/next-upgrade-publish-result.json
          NEXT_UPGRADE_CALLER_WORKFLOW: ${{ github.workflow_ref }}
          NEXT_UPGRADE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ secrets.publish-token }}
        run: node next-source/.github/actions/next-upgrade/publish-upgrade.mjs
