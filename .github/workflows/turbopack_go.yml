name: Turbopack Go files

on:
  pull_request:
    paths:
      - '.github/workflows/turbopack_go.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'turbopack/crates/turbopack-go/**'
      - 'turbopack/crates/turbopack-go-toolchain/**'
      - 'turbopack/xtask/**'
      - '.github/actions/setup-go-toolchain/**'
      - '.github/workflows/turbopack_go_toolchain.yml'
      - 'turbopack/crates/turbopack-cli/**'
      - 'turbopack/crates/turbo-tasks-fs/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-go:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-go-toolchain
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test native Go bundles and CLI
        env:
          TURBOPACK_GO: go
        run: cargo test -p turbopack-go-toolchain -p turbopack-go -p turbopack-cli
