name: Pull Request Auto-Labeler

# Runs on pull_request_target so the workflow has the permissions of the
# base repository and can write labels on PRs opened from forks.
#
# `pull_request_target` is only risky when a workflow holding a
# write-scoped token also executes PR-controlled content — e.g. checking
# out the PR head and running its build/install scripts, or interpolating
# PR text (titles, bodies, branch names) directly into shell commands.
# This workflow does neither:
#
#   1. Checkout is pinned to the BASE ref (`github.event.pull_request.base.sha`)
#      with `persist-credentials: false`, so the labeler config
#      (`.github/labeler.json`) and the compiled action bundle
#      (`.github/actions/next-repo-actions/dist/pr-auto-label/`) always
#      come from the trusted base branch. A fork PR cannot modify these
#      files to grant itself team-only labels.
#   2. No PR-controlled code executes on the runner. We don't run
#      `pnpm install` / `npm install` / `setup-node` with a lockfile from
#      the PR, and we don't run any script defined by the PR's
#      `package.json`. The action bundle is pre-built and committed.
#   3. No PR-controlled text is interpolated into `run:` scripts. The
#      action reads only the static config from the base checkout plus
#      `pull_request.user.login` and the list of changed files via the
#      GitHub API — both authenticated by GitHub and not forgeable by the
#      PR author — and passes them to the `octokit` client, not to a
#      shell.
#   4. `permissions` is scoped to the minimum needed: `pull-requests: write`
#      (to apply labels) and `contents: read` (to check out the base).
#   5. `if: github.repository_owner == 'vercel'` prevents the workflow
#      from running in unrelated forks of this repo.
#
# If you ever change this workflow to check out the PR head, install
# dependencies from the PR, or interpolate PR-provided strings into a
# shell command, revisit this threat model.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: github.repository_owner == 'vercel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Always check out the base repo / base branch, never the PR head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
      - name: Apply labels
        run: node ./.github/actions/next-repo-actions/dist/pr-auto-label/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
