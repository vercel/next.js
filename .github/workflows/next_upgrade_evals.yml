name: Next upgrade evals

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/next/**'
      - 'packages/next-codemod/**'
      - 'docs/**/upgrading/**'
      - 'evals/next-upgrade/**'
      - '.github/workflows/next_upgrade_evals.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run (all runs each scenario with both harnesses)
        type: choice
        default: all
        options: [all, same-major, major-migration, existing-pr, lookup-blocked]

permissions: {}

concurrency:
  group: next-upgrade-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-evals:
    permissions:
      contents: read
    # Opt-in, same-repository PRs only. Never use pull_request_target for eval code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci:upgrade-evals') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:upgrade-evals'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Configure credentials/reviewers here before opting a PR into paid runs.
    environment: next-upgrade-evals
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build candidate packages
        run: pnpm build
      - name: Run upgrade evals in Vercel Sandbox
        env:
          SCENARIO: ${{ inputs.scenario || 'all' }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          # Empty optional secrets must not shadow agent-eval's OIDC fallback.
          for name in VERCEL_OIDC_TOKEN VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_PROJECT_ID AI_GATEWAY_API_KEY; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          if [ -z "${VERCEL_OIDC_TOKEN:-}" ]; then
            for name in VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_PROJECT_ID AI_GATEWAY_API_KEY; do
              if [ -z "${!name:-}" ]; then
                echo "::error::Missing ${name}. Supply Vercel OIDC or explicit Sandbox and Gateway credentials."
                exit 1
              fi
            done
          fi
          if [ "$SCENARIO" = all ]; then
            pnpm eval:upgrade
          else
            pnpm eval:upgrade "$SCENARIO"
          fi
      - name: Retain transcripts and grading evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-upgrade-evals-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/next-upgrade/results/
          if-no-files-found: warn
          retention-days: 14
