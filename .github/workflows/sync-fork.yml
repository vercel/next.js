name: Sync fork

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh repo sync ${{ github.repository }} -b canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
