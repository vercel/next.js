name: retry-tests

on:
  workflow_run:
    # Make sure that required_job_conclusion knows what the name of the required
    # job is in each workflow.
    workflows: ['build-and-test', 'build-and-deploy']
    branches: [canary]
    types:
      - completed

env:
  SLACK_WEBHOOK_URL: ${{ secrets.BROKEN_CANARY_SLACK_WEBHOOK_URL }}

permissions: {}

jobs:
  retry-on-failure:
    name: retry failed jobs
    # Retry the build-and-test workflow up to 2 times. Cancelled runs are only
    # retried when a job hit its timeout (e.g. a hanging test), never when the
    # run was cancelled manually or by concurrency.
    if: >-
      ${{ 
        (github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'cancelled') &&
        github.repository == 'vercel/next.js' &&
        github.event.workflow_run.run_attempt < 3
      }}
    permissions:
      actions: write
      # Read check-run annotations to tell timed-out runs from manually cancelled ones
      checks: read
    runs-on: ubuntu-latest
    steps:
      - name: Check whether a job timed out
        id: timed_out
        if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            // Keep in sync with the same step in report-failure below
            const run = context.payload.workflow_run
            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              {
                attempt_number: run.run_attempt,
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }
            )

            for (const job of jobs) {
              if (job.conclusion !== 'cancelled' && job.conclusion !== 'failure') {
                continue
              }
              const checkRunId = job.check_run_url?.split('/').pop()
              if (!checkRunId) {
                continue
              }
              const annotations = await github.paginate(
                'GET /repos/{owner}/{repo}/check-runs/{check_run_id}/annotations',
                {
                  check_run_id: checkRunId,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              )
              if (
                annotations.some((annotation) =>
                  annotation.message?.includes('exceeded the maximum execution time')
                )
              ) {
                console.log('Job %s timed out: %s', job.name, job.html_url)
                return true
              }
            }

            console.log('No timed-out job found, not retrying the cancelled run')
            return false
      - name: Check conclusion of required job
        id: required_job_conclusion
        if: ${{ github.event.workflow_run.conclusion == 'failure' || steps.timed_out.outputs.result == 'true' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            // See build-and-test.yml and build-and-deploy.yml for the required job names
            const requiredJobName = {
              'build-and-test': 'thank you, next',
              'build-and-deploy': 'thank you, build',
            }[context.payload.workflow_run.name]

            async function rerunIfRequiredNotSuccessful() {
              const result = await github.paginate.iterator(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
                {
                  attempt_number: context.payload.workflow_run.run_attempt,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.payload.workflow_run.id,
                }
              )

              for await (const { data: jobs } of result) {
                for (const job of jobs) {
                  if (job.name === requiredJobName) {
                    console.log(
                      "Using conclusion '%s' from %s",
                      job.conclusion,
                      job.html_url
                    )
                    return job.conclusion
                  }
                }
              }

              console.log("Couldn't find job with name '%s'", requiredJobName)
              return null
            }

            return await rerunIfRequiredNotSuccessful()
      - name: send retry request to GitHub API
        if: >-
          ${{
            (github.event.workflow_run.conclusion == 'failure' ||
              steps.timed_out.outputs.result == 'true') &&
            steps.required_job_conclusion.outputs.result != '"success"'
          }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs

  report-failure:
    name: report failure to slack
    # Report the failure to Slack if the build-and-test workflow has failed 3 times
    # (or was cancelled 3 times because a job timed out)
    # build-and-deploy is not retried so we always report it
    if: >-
      ${{ 
        (github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'cancelled') &&
        github.event.workflow_run.run_attempt >= 3 &&
        !github.event.workflow_run.head_repository.fork
      }}
    permissions:
      actions: read
      checks: read
    runs-on: ubuntu-latest
    steps:
      - name: Check whether a job timed out
        id: timed_out
        if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            // Keep in sync with the same step in retry-on-failure above
            const run = context.payload.workflow_run
            const jobs = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              {
                attempt_number: run.run_attempt,
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }
            )

            for (const job of jobs) {
              if (job.conclusion !== 'cancelled' && job.conclusion !== 'failure') {
                continue
              }
              const checkRunId = job.check_run_url?.split('/').pop()
              if (!checkRunId) {
                continue
              }
              const annotations = await github.paginate(
                'GET /repos/{owner}/{repo}/check-runs/{check_run_id}/annotations',
                {
                  check_run_id: checkRunId,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              )
              if (
                annotations.some((annotation) =>
                  annotation.message?.includes('exceeded the maximum execution time')
                )
              ) {
                console.log('Job %s timed out: %s', job.name, job.html_url)
                return true
              }
            }

            console.log('No timed-out job found, not reporting the cancelled run')
            return false
      - name: Check conclusion of required job
        id: required_job_conclusion
        if: ${{ github.event.workflow_run.conclusion == 'failure' || steps.timed_out.outputs.result == 'true' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            // See build-and-test.yml and build-and-deploy.yml for the required job names
            const requiredJobName = {
              'build-and-test': 'thank you, next',
              'build-and-deploy': 'thank you, build',
            }[context.payload.workflow_run.name]

            async function rerunIfRequiredNotSuccessful() {
              const result = await github.paginate.iterator(
                'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
                {
                  attempt_number: context.payload.workflow_run.run_attempt,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.payload.workflow_run.id,
                }
              )

              for await (const { data: jobs } of result) {
                for (const job of jobs) {
                  if (job.name === requiredJobName) {
                    console.log(
                      "Using conclusion '%s' from %s",
                      job.conclusion,
                      job.html_url
                    )
                    return job.conclusion
                  }
                }
              }

              console.log("Couldn't find job with name '%s'", requiredJobName)
              return null
            }

            return await rerunIfRequiredNotSuccessful()
      - name: send webhook
        if: >-
          ${{
            (github.event.workflow_run.conclusion == 'failure' ||
              steps.timed_out.outputs.result == 'true') &&
            steps.required_job_conclusion.outputs.result != '"success"'
          }}
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          # These urls are intentionally missing the protocol,
          # allowing them to be transformed into actual links in the Slack workflow
          # (through slightly hacky means).
          payload: |
            {
              "commit_title": ${{ toJSON(github.event.workflow_run.display_title) }},
              "commit_url": "github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}",
              "workflow_run_url": "github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/attempts/${{ github.event.workflow_run.run_attempt }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
