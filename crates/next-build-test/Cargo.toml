[package]
name = "next-build-test"
version = "0.1.0"
description = "TBD"
license = "MIT"
edition = "2024"
autobenches = false

[lints]
workspace = true

[features]
default = ["tokio_runtime", "process_pool"]
process_pool = ["next-api/process_pool", "turbopack-node/process_pool"]
tokio_runtime = [
  "next-api/tokio_runtime",
  "next-core/tokio_runtime",
  "turbo-tasks/tokio_runtime",
  "turbo-tasks-backend/tokio_runtime",
  "turbopack-core/tokio_runtime",
  "turbopack-node/tokio_runtime",
]
# The no-tokio sync build: drives a production `next build` through `run_sync`
# (sequential strategy only; the concurrent/parallel tokio-stream paths and dev
# HMR stay async-only). tokio remains linked as an I/O edge (node pool, etc.).
sync = [
  "process_pool",
  "next-api/sync",
  "next-core/sync",
  "turbo-tasks/sync",
  "turbo-tasks-backend/sync",
  "turbopack-core/sync",
  "turbopack-node/sync",
]

[dependencies]
anyhow = { workspace = true }
futures-util = "0.3.30"
next-api = { path = "../next-api", default-features = false }
next-core = { path = "../next-core", default-features = false }
num_cpus = "1.16.0"
rand = { workspace = true }
swc_core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1.15"
tracing = { workspace = true }
tracing-subscriber = "0.3"
turbo-rcstr = { workspace = true }
turbo-tasks = { path = "../../turbopack/crates/turbo-tasks", default-features = false }
turbo-tasks-backend = { path = "../../turbopack/crates/turbo-tasks-backend", default-features = false }
turbo-tasks-malloc = { workspace = true }
turbopack-core = { path = "../../turbopack/crates/turbopack-core", default-features = false }
turbopack-trace-utils = { workspace = true }
turbopack-node = { path = "../../turbopack/crates/turbopack-node", default-features = false }
