services:
  with-docker-multi-env-production:
    build:
      context: ../../
      dockerfile: docker/production/Dockerfile
    image: with-docker-multi-env-production
    ports:
      - "3003:3000"
    environment:
      # Read from your shell, for example `API_SECRET=... make start-production`.
      API_SECRET: ${API_SECRET:-}
