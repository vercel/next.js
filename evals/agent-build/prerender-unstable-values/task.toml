schema_version = "1.4"
artifacts = ["/tmp/agent.patch"]

[task]
name = "nextjs/prerender-unstable-values"
version = "0.1.0"
authors = [{ name = "Aurora Scharff" }]
description = "Resolve four unstable-value prerender errors in a Cache Components app, where each site needs a different fix: cache the footer year, cache the fetched-at timestamp with its data, defer a client relative time, and keep a vendored SDK's clock read out of the prerender."
keywords = [
  "nextjs",
  "agent-build",
  "cache-components",
  "blocking-prerender-current-time",
  "io",
]

[metadata]
product = "nextjs"
measurement = "agent-build"
capability = "unstable-value-prerender-decisions"
framework = "nextjs"
framework_version = "16.4.2"
source = "reviewed-agent-feedback"
feedback_findings = ["F-007", "4115", "4398", "3830", "5037"]

[agent]
user = "agent"
network_mode = "public"
timeout_sec = 1800.0

[verifier]
user = "root"
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 1800.0

[[verifier.collect]]
service = "main"
user = "root"
timeout_sec = 120.0
command = "git --git-dir=/opt/eval/base.git --work-tree=/app add -A && git --git-dir=/opt/eval/base.git --work-tree=/app diff --cached --binary HEAD > /tmp/agent.patch"

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
