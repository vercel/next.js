schema_version = "1.4"
artifacts = ["/tmp/agent.patch"]

[task]
name = "nextjs/protected-routes-instant-scope"
version = "0.3.1"
authors = [{ name = "Aurora Scharff" }]
description = "Make a session-protected workspace instant under Cache Components without opt-outs: real HTTP redirects for signed-out visitors, a prerendered frame for every workspace route, URL and session reads below Suspense, and a vendored SDK clock read kept out of the prerender."
keywords = [
  "nextjs",
  "agent-build",
  "cache-components",
  "instant-validation",
  "blocking-route",
  "proxy",
]

[metadata]
product = "nextjs"
measurement = "agent-build"
capability = "protected-routes-instant-scope"
framework = "nextjs"
framework_version = "16.4.2"
source = "reviewed-agent-feedback"
feedback_findings = ["4070", "5011", "4442", "F-009", "F-012"]

[agent]
user = "agent"
network_mode = "public"
timeout_sec = 1800.0

[verifier]
user = "root"
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 1800.0

[[verifier.collect]]
service = "main"
user = "root"
timeout_sec = 120.0
command = "git --git-dir=/opt/eval/base.git --work-tree=/app add -A && git --git-dir=/opt/eval/base.git --work-tree=/app diff --cached --binary HEAD > /tmp/agent.patch"

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
