schema_version = "1.4"
artifacts = ["/tmp/agent.patch"]

[task]
name = "nextjs/page-weight-budgets"
version = "0.1.0"
authors = [{ name = "Aurora Scharff" }]
description = "Bring a working storefront within stated HTML, JavaScript, and image byte budgets per page without changing how it looks or works, including for products and photos added after the change. The causes are the basics customer audits find: raw img tags, client-rendered pages that import the catalog, full records passed to Client Components, a whole icon set on the client, and repeated inline SVG."
keywords = [
  "nextjs",
  "agent-build",
  "performance",
  "next-image",
  "server-components",
  "page-weight",
]

[metadata]
product = "nextjs"
measurement = "agent-build"
capability = "page-weight-budgets"
framework = "nextjs"
framework_version = "16.4.2"
source = "customer-audits"

[agent]
user = "agent"
network_mode = "public"
timeout_sec = 1800.0

[verifier]
user = "root"
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 1800.0

[[verifier.collect]]
service = "main"
user = "root"
timeout_sec = 120.0
command = "git --git-dir=/opt/eval/base.git --work-tree=/app add -A && git --git-dir=/opt/eval/base.git --work-tree=/app diff --cached --binary HEAD > /tmp/agent.patch"

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
