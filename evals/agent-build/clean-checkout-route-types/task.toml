schema_version = "1.4"
artifacts = ["/tmp/agent.patch"]

[task]
name = "nextjs/clean-checkout-route-types"
version = "0.1.1"
authors = [{ name = "Aurora Scharff" }]
description = "Make a strict CI typecheck pass from a clean clone of an app that depends on generated Next.js route types, without committing generated output or weakening the types."
keywords = ["nextjs", "agent-build", "typegen", "route-types", "ci"]

[metadata]
product = "nextjs"
measurement = "agent-build"
capability = "generated-route-types-clean-ci"
framework = "nextjs"
framework_version = "16.4.2"
source = "reviewed-agent-feedback"
feedback_findings = ["4237", "1130", "F-003"]

[agent]
user = "agent"
network_mode = "public"
timeout_sec = 1500.0

[verifier]
user = "root"
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 1500.0

[[verifier.collect]]
service = "main"
user = "root"
timeout_sec = 120.0
command = "git --git-dir=/opt/eval/base.git --work-tree=/app add -A && git --git-dir=/opt/eval/base.git --work-tree=/app diff --cached --binary HEAD > /tmp/agent.patch"

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 12288

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 12288
