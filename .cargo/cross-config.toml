# Cross-compilation config for Linux docker builds.
#
# This file is NOT read by cargo directly. It is parsed by
# `cargo xtask print-rustflags --cross-config .cargo/cross-config.toml`
# and the flags are passed via the RUSTFLAGS env var.
#
# This keeps cross-compilation flags out of .cargo/config.toml so that
# local Linux development doesn't require lld or cross-compilers.
#
# All 4 Linux targets use the same toolchain: clang (compiler) + rust-lld
# (linker, via gnu-lld-cc flavor). GNU targets use Ubuntu's multiarch
# sysroots (clang finds them via --target). Musl targets use sysroots
# from musl.cc cross-toolchains.

# All Linux targets: use rust-lld via the cc linker driver and enable ICF
# (Identical Code Folding) to reduce binary size.
#
# Why `linker-flavor=gnu-lld-cc` instead of `linker = "rust-lld"`?
# See .cargo/config.toml for the full explanation.
[target.'cfg(target_os = "linux")']
rustflags = [
  "-Clinker-flavor=gnu-lld-cc",
  "-Clink-arg=-Wl,--icf=all",
]

# Musl targets: disable static CRT linking (we produce dynamic .node shared
# libraries, not static binaries).
[target.'cfg(all(target_os = "linux", target_env = "musl"))']
rustflags = [
  "-Ctarget-feature=-crt-static",
]

# GNU targets: clang cross-compilation via --target + --sysroot.
# The crossbuild-essential packages install cross sysroots at
# /usr/<triple>/ (not the native multiarch /usr/include/<triple>/ layout),
# so --sysroot is required.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-Clink-arg=--target=x86_64-linux-gnu",
  "-Clink-arg=--sysroot=/usr/x86_64-linux-gnu",
]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-Clink-arg=--target=aarch64-linux-gnu",
  "-Clink-arg=--sysroot=/usr/aarch64-linux-gnu",
]

# Musl targets: clang + musl sysroot from musl.cc cross-toolchain.
# --sysroot points to the musl headers/libs/crt files.
# --gcc-toolchain tells clang where to find libgcc (needed for unwinding).
[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = [
  "-Clink-arg=--target=x86_64-linux-musl",
  "-Clink-arg=--sysroot=/opt/x86_64-linux-musl-cross/x86_64-linux-musl",
  "-Clink-arg=--gcc-toolchain=/opt/x86_64-linux-musl-cross",
]

[target.aarch64-unknown-linux-musl]
linker = "clang"
rustflags = [
  "-Clink-arg=--target=aarch64-linux-musl",
  "-Clink-arg=--sysroot=/opt/aarch64-linux-musl-cross/aarch64-linux-musl",
  "-Clink-arg=--gcc-toolchain=/opt/aarch64-linux-musl-cross",
]
